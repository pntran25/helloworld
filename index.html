<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phi Tran — Portfolio</title>
    <meta name="author" content="Phi Tran">
    <meta name="description" content="Portfolio of Phi Tran — Computer Science student at the University of Houston, focused on cybersecurity.">
    <link rel="icon" href="images/computer.png">

    <!-- Link previews. og:image needs an absolute URL. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Phi Tran — Portfolio">
    <meta property="og:description" content="Computer Science student at the University of Houston, focused on cybersecurity. A portfolio built as a Windows 95 desktop.">
    <meta property="og:url" content="https://pntran25.github.io/helloworld/">
    <meta property="og:image" content="https://pntran25.github.io/helloworld/images/me.jpg">
    <meta name="twitter:card" content="summary">

    <!-- Cascade order: foundations first, overrides last. -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/boot.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/window.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Content first, then the code that renders it. -->
    <script src="data/content.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/windows.js" defer></script>
    <script src="js/terminal.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <!-- ===== Boot screen ================================================ -->
    <button class="image-button" type="button" aria-label="Enter the portfolio"></button>

    <p class="boot-text loading-text glitch"></p>
    <p class="boot-text welcome-text glitch"></p>

    <!-- ===== Desktop ==================================================== -->
    <main>
        <div class="desktop-icons" id="desktopIcons">
            <div class="eyes-deco">
                <img id="mascotFace" src="" alt="">
                <div class="chat-bubble"></div>
            </div>
        </div>

        <div class="taskbar">
            <div class="taskbar-start" id="taskbarStart"></div>
            <div class="taskbar-tabs" id="taskbarTabs"></div>
            <div class="taskbar-links" id="taskbarLinks"></div>
            <div class="taskbar-clock" id="taskbarClock"></div>
        </div>
    </main>

    <!-- ===== Windows =====================================================
         Both the icons above and the windows here are built from
         data/content.js by js/render.js. -->
    <div id="windowLayer"></div>

</body>
</html>
